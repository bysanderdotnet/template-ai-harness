name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Superseded runs on the same branch/PR are wasted minutes; cancel them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # raise if builds are slow
    steps:
      - uses: actions/checkout@v4

      # TODO(setup): install the project toolchain before running verify.sh.
      # Examples:
      #   - uses: actions/setup-node@v4
      #     with: { node-version: 22, cache: npm }
      #   - uses: astral-sh/setup-uv@v5

      - name: Harness health check
        run: |
          # TEMPLATE: delete this guard during bootstrap.
          if [[ -f TEMPLATE_SETUP.md ]]; then
            echo "Template not bootstrapped yet; running template self-checks instead."
            bash -n .agents/scripts/init.sh
            bash -n .agents/scripts/verify.sh
            [[ -L CLAUDE.md && -L GEMINI.md && -L .claude/skills ]]
            python3 -c "import json; json.load(open('.agents/state/feature_list.json'))"
            for f in .agents/skills/*/SKILL.md; do
              grep -q '^description: ' "$f" || { echo "FAIL: $f missing description frontmatter"; exit 1; }
            done
            exit 0
          fi
          bash .agents/scripts/init.sh

      - name: Run definition of done
        run: |
          # TEMPLATE: delete this guard during bootstrap.
          if [[ -f TEMPLATE_SETUP.md ]]; then
            echo "Template not bootstrapped yet; skipping verify."
            exit 0
          fi
          bash .agents/scripts/verify.sh
