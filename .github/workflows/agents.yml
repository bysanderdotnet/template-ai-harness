name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Superseded runs on the same branch/PR are wasted minutes; cancel them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # raise if builds are slow
    steps:
      - uses: actions/checkout@v4

      # TODO(setup): install the project toolchain before running verify.
      # Examples:
      #   - uses: actions/setup-node@v4
      #     with: { node-version: 22, cache: npm }
      #   - uses: astral-sh/setup-uv@v5

      - name: Harness health check
        run: |
          python3 .agents/harness.py check
          # Before bootstrap (TEMPLATE_SETUP.md present) init/verify exit 1
          # by design; the structure check above is the whole gate then.
          if [[ ! -f TEMPLATE_SETUP.md ]]; then
            python3 .agents/harness.py init
          fi

      - name: Run definition of done
        run: |
          if [[ -f TEMPLATE_SETUP.md ]]; then
            echo "Template not bootstrapped yet; skipping verify."
            exit 0
          fi
          python3 .agents/harness.py verify
