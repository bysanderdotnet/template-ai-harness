name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Superseded runs on the same branch/PR are wasted minutes; cancel them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # raise if builds are slow
    steps:
      - uses: actions/checkout@v4

      # TODO(setup): install the project toolchain so `agents.py ci` can run
      # the registered verify commands. Examples:
      #   - uses: actions/setup-node@v4
      #     with: { node-version: 22, cache: npm }
      #   - uses: astral-sh/setup-uv@v5

      - name: Harness gates
        # check always; init + verify once guided setup is complete.
        run: python3 .agents/agents.py ci
