name: PR automation

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  statuses: read

concurrency:
  group: pr-automation-${{ github.repository }}
  cancel-in-progress: false

jobs:
  auto-merge-pr:
    runs-on: ubuntu-latest
    outputs:
      has_open_prs: ${{ steps.merge.outputs.has_open_prs }}
      auto_merge_enabled: ${{ steps.merge.outputs.auto_merge_enabled }}
    steps:
      - uses: actions/checkout@v4
      - name: Auto-merge eligible PRs
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .agents/github_automation.py auto-merge-pr --repo "${{ github.repository }}"

  auto-create-pr:
    runs-on: ubuntu-latest
    needs: auto-merge-pr
    steps:
      - uses: actions/checkout@v4
      - name: Trigger next PR webhook
        run: >-
          python .agents/github_automation.py auto-create-pr
          --has-open-prs "${{ needs.auto-merge-pr.outputs.has_open_prs || 'true' }}"
